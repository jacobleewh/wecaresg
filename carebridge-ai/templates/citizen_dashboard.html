{% extends "base.html" %}
{% block title %}My WeCareSG Chat{% endblock %}

{% block extra_head %}<style>
main .glass-card { min-height: 0; }
#triage-progress [aria-current="step"] { color: #34d399; border-color: #34d399; }
#support-choice option { background: #0b0f19; color: #e2e8f0; }
</style>{% endblock %}
{% block body %}
  {% include "_citizen_nav.html" %}

  <main class="flex-1 max-w-[960px] w-full mx-auto px-6 py-8">

    {% include "_guided_intake.html" %}
  </main>

  <!-- Patient summary modal -->
  <div id="summary-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="font-bold text-white flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-emerald-400"></i>What You Shared</h3>
        <button onclick="closeModal('summary-modal')" class="modal-close">&times;</button>
      </div>
      <div id="summary-content" class="modal-body"></div>
      <div id="summary-saved-actions" class="modal-footer hidden">
        <button onclick="downloadSummary()" class="mini-action-btn mini-action-btn--emerald">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>Download Summary
        </button>
      </div>
    </div>
  </div>

  <!-- Scheme details modal -->
  <div id="scheme-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="font-bold text-white flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>Scheme Details</h3>
        <button onclick="closeModal('scheme-modal')" class="modal-close">&times;</button>
      </div>
      <div id="scheme-content" class="modal-body"></div>
    </div>
  </div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/citizen.js') }}"></script>
<script src="{{ url_for('static', filename='js/guided-intake.js') }}"></script>
{% endblock %}
